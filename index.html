<!doctype html>
<html lang="ko">
  <head>
<script type="module">
  import { createSDK } from "https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js";
  const sdk = createSDK();
  window.__onestoreSdk = sdk;
  sdk.on("pause", () => document.dispatchEvent(new Event("onestore:pause")));
  sdk.on("resume", () => document.dispatchEvent(new Event("onestore:resume")));
  sdk.on("exit", () => {});
  sdk.initializeAsync().then((info) => {
    if (info && info.err) return; // 일반 브라우저: 그냥 웹으로 동작
    const sa = info.safeArea || {};
    const r = document.documentElement.style;
    r.setProperty("--os-safe-top", (sa.top || 0) + "px");
    r.setProperty("--os-safe-bottom", (sa.bottom || 0) + "px");
    sdk.setLoadingProgress(100);
    return sdk.startGameAsync();
  }).catch((e) => console.warn("ONEStore SDK init 실패", e && e.reason, e && e.message));
</script>
